    <div class="controls">
        <button class="btn" onclick="fetchNews()">🔄 Refresh News</button>
        <button class="btn btn-secondary" onclick="selectAll()">Select All</button>
        <button class="btn btn-secondary" onclick="clearSelection()">Clear Selection</button>
        <button class="btn btn-analyze" id="analyzeBtn" onclick="analyzeNews()" disabled>
            🤖 Analyze with AI (<span id="selectedCount">0</span> selected)
        </button>
    </div>

    <div class="source-filters" id="sourceFilters"></div>

    <div class="selection-info" id="selectionInfo" style="display: none;">
        <span id="selectionText"></span>
    </div>

    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Loading financial news...</p>
    </div>

    <div id="error"></div>

    <div class="news-grid" id="newsGrid"></div>

    <div class="analysis-panel" id="analysisPanel">
        <h2>🎯 AI Investment Analysis</h2>
        <div class="analysis-content" id="analysisContent"></div>
    </div>
</div>

<script>
    let articles = [];
    let selectedArticles = new Set();
    let activeFilters = new Set();

    // RSS feeds for financial news
    const RSS_FEEDS = [
        { name: 'MarketWatch', url: 'https://www.marketwatch.com/rss/topstories' },
        { name: 'Reuters Business', url: 'https://www.reutersagency.com/feed/?taxonomy=best-topics&post_type=best' },
        { name: 'CNBC', url: 'https://www.cnbc.com/id/100003114/device/rss/rss.html' },
        { name: 'Bloomberg', url: 'https://www.bloomberg.com/feed/podcast/etf-report.xml' },
        { name: 'WSJ Markets', url: 'https://feeds.a.dj.com/rss/RSSMarketsMain.xml' },
        { name: 'Financial Times', url: 'https://www.ft.com/?format=rss' },
        { name: 'Yahoo Finance', url: 'https://finance.yahoo.com/rss/' },
        { name: 'Seeking Alpha', url: 'https://seekingalpha.com/feed.xml' }
    ];

    // Initialize
    window.onload = function() {
        fetchNews();
    };

    async function fetchNews() {
        const loading = document.getElementById('loading');
        const newsGrid = document.getElementById('newsGrid');
        const errorDiv = document.getElementById('error');
        
        loading.style.display = 'block';
        newsGrid.innerHTML = '';
        errorDiv.innerHTML = '';
        articles = [];

        try {
            // Use RSS2JSON service to parse feeds
            const promises = RSS_FEEDS.map(feed => 
                fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`)
                    .then(res => res.json())
                    .then(data => ({
                        source: feed.name,
                        items: data.items || []
                    }))
                    .catch(err => ({ source: feed.name, items: [] }))
            );

            const results = await Promise.all(promises);
            
            // Combine all articles
            results.forEach(result => {
                result.items.forEach(item => {
                    articles.push({
                        title: item.title,
                        description: item.description?.replace(/<[^>]*>/g, '').substring(0, 200) + '...' || '',
                        link: item.link,
                        source: result.source,
                        pubDate: item.pubDate,
                        sentiment: analyzeSentiment(item.title + ' ' + (item.description || ''))
                    });
                });
            });

            // Sort by date
            articles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            // Create source filters
            createSourceFilters();
            
            // Display articles
            displayArticles();

        } catch (error) {
            errorDiv.innerHTML = `<div class="error">Error loading news: ${error.message}. Try refreshing the page.</div>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    function analyzeSentiment(text) {
        const negative = ['crash', 'fall', 'drop', 'decline', 'loss', 'bear', 'recession', 'crisis', 'tumble', 'plunge', 'worry', 'fear', 'risk'];
        const positive = ['rise', 'gain', 'surge', 'rally', 'bull', 'growth', 'profit', 'boom', 'soar', 'jump'];
        
        const lowerText = text.toLowerCase();
        const negCount = negative.filter(word => lowerText.includes(word)).length;
        const posCount = positive.filter(word => lowerText.includes(word)).length;
        
        if (negCount > posCount) return 'negative';
        if (posCount > negCount) return 'positive';
        return 'neutral';
    }

    function createSourceFilters() {
        const sources = [...new Set(articles.map(a => a.source))];
        const filterDiv = document.getElementById('sourceFilters');
        
        filterDiv.innerHTML = sources.map(source => 
            `<div class="source-tag" onclick="toggleFilter('${source}')">${source}</div>`
        ).join('');
    }

    function toggleFilter(source) {
        if (activeFilters.has(source)) {
            activeFilters.delete(source);
        } else {
            activeFilters.add(source);
        }
        
        // Update UI
        document.querySelectorAll('.source-tag').forEach(tag => {
            if (tag.textContent === source) {
                tag.classList.toggle('active');
            }
        });
        
        displayArticles();
    }

    function displayArticles() {
        const newsGrid = document.getElementById('newsGrid');
        const filteredArticles = activeFilters.size > 0 
            ? articles.filter(a => activeFilters.has(a.source))
            : articles;

        if (filteredArticles.length === 0) {
            newsGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">No articles found. Try different filters or refresh.</p>';
            return;
        }

        newsGrid.innerHTML = filteredArticles.slice(0, 50).map((article, index) => `
            <div class="news-card ${selectedArticles.has(index) ? 'selected' : ''}" onclick="toggleArticle(${index})">
                <div class="news-card-header">
                    <span class="source-badge">${article.source}</span>
                    <span class="sentiment ${article.sentiment}">${article.sentiment}</span>
                </div>
                <div class="news-title">${article.title}</div>
                <div class="news-description">${article.description}</div>
                <div class="news-meta">
                    <span>${new Date(article.pubDate).toLocaleDateString()}</span>
                    <a href="${article.link}" target="_blank" onclick="event.stopPropagation()" style="color: #0066ff;">Read →</a>
                </div>
                ${selectedArticles.has(index) ? '<div class="checkbox">✓</div>' : ''}
            </div>
        `).join('');
    }

    function toggleArticle(index) {
        if (selectedArticles.has(index)) {
            selectedArticles.delete(index);
        } else {
            selectedArticles.add(index);
        }
        
        updateSelection();
        displayArticles();
    }

    function selectAll() {
        const filteredArticles = activeFilters.size > 0 
            ? articles.map((a, i) => ({ article: a, index: i })).filter(({ article }) => activeFilters.has(article.source))
            : articles.map((a, i) => ({ article: a, index: i }));
        
        filteredArticles.slice(0, 50).forEach(({ index }) => selectedArticles.add(index));
        updateSelection();
        displayArticles();
    }

    function clearSelection() {
        selectedArticles.clear();
        updateSelection();
        displayArticles();
    }

    function updateSelection() {
        const count = selectedArticles.size;
        document.getElementById('selectedCount').textContent = count;
        document.getElementById('analyzeBtn').disabled = count === 0;
    }

    async function analyzeNews() {
        const analysisPanel = document.getElementById('analysisPanel');
        const analysisContent = document.getElementById('analysisContent');
        
        analysisPanel.classList.add('visible');
        analysisContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing selected articles with AI...</p></div>';
        
        // Scroll to analysis
        analysisPanel.scrollIntoView({ behavior: 'smooth' });

        // Prepare articles for analysis
        const selectedArticleData = Array.from(selectedArticles).map(index => {
            const article = articles[index];
            return `[${article.source}] ${article.title}\n${article.description}\nSentiment: ${article.sentiment}\nLink: ${article.link}`;
        }).join('\n\n---\n\n');

        const prompt = `You are an expert investment analyst. Analyze these news articles and provide actionable investment insights based on the "buy when there's blood in the streets" contrarian investing strategy.
```

News Articles:
${selectedArticleData}

Please provide:

1. **Market Sentiment Overview**: What’s the overall mood in these articles? Fear? Greed? Uncertainty?
1. **Contrarian Opportunities**: Based on the Baron Rothschild principle of buying when there’s blood in the streets, what specific opportunities do you see?
1. **Sectors/Assets to Watch**: Which sectors or specific assets might be oversold or undervalued based on this news?
1. **Risk Assessment**: What are the main risks to be aware of?
1. **Actionable Recommendations**: Give 3-5 specific, practical investment ideas with reasoning.

Be direct, specific, and focus on actionable insights. Consider both short-term trading opportunities and long-term value plays.`;

```
        try {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    model: "claude-sonnet-4-20250514",
                    max_tokens: 4000,
                    messages: [
                        { role: "user", content: prompt }
                    ]
                })
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            const analysis = data.content[0].text;
            
            // Format the response
            analysisContent.innerHTML = formatAnalysis(analysis);
            
        } catch (error) {
            analysisContent.innerHTML = `<div class="error">Error analyzing news: ${error.message}. Make sure you have a valid API connection.</div>`;
        }
    }

    function formatAnalysis(text) {
        // Simple formatting for better readability
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n\n/g, '<br><br>')
            .replace(/^(\d+\.\s.*?)$/gm, '<strong>$1</strong>');
    }
</script>
